name: VYRO checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VYRO_TEST_DATABASE_URL: postgres://vyro_ci:vyro_ci@127.0.0.1:5432/vyro_ci_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache-dependency-path: backend/go.sum
      - name: Install native PostgreSQL and PostGIS
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-postgis-3
          if ! pg_isready -p 5432; then sudo pg_ctlcluster 16 main start; fi
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE vyro_ci LOGIN PASSWORD 'vyro_ci';"
          sudo -u postgres createdb vyro_ci_test
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d vyro_ci_test < database/schema.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d vyro_ci_test -c 'GRANT USAGE ON SCHEMA public TO vyro_ci; GRANT SELECT,INSERT,UPDATE,DELETE,TRUNCATE ON ALL TABLES IN SCHEMA public TO vyro_ci;'
      - name: Tests, race detection, and vet
        working-directory: backend
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
